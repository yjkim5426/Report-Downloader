name: Daily 증권사 리포트 자동 수집

on:
  schedule:
    # 월~금 한국시간(KST) 오전 08:30 실행 (UTC 기준 23:30)
    - cron: '30 23 * * 0-4'
  workflow_dispatch: # 깃허브 웹 화면에서 수동 실행할 수 있는 버튼 활성화

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 체크아웃
      uses: actions/checkout@v3

    - name: 파이썬 3.10 설정
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 의존 패키지 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 리포트 다운로드 및 구글 드라이브 업로드 실행
      env:
        GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
      run: |
        python auto_report_cloud.py
