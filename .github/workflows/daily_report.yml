name: Daily 증권사 리포트 자동 수집

on:
  schedule:
    # 매일 한국시간(KST) 01:00 실행 (UTC 기준 전일 16:00)
    - cron: '0 16 * * *'
  workflow_dispatch: # 웹에서 필요 시 수동 실행 가능

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 체크아웃
      uses: actions/checkout@v3

    - name: 파이썬 3.10 설정
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 의존 패키지 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 전일자 리포트 다운로드 및 구글 드라이브 업로드 실행
      env:
        GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
      run: |
        python auto_report_cloud.py
